services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www/php
    depends_on:
      - promodata-postgres

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/php
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # Имя сервиса = DNS-имя внутри сети, поэтому DB_HOST=promodata-postgres работает без правок .env.
  promodata-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: promodata
      POSTGRES_USER: promodata
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
